<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Estructuras de Plantas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <h1 id="pageTitle">🌱 Explorador de Estructuras de Plantas</h1>
    <button class="std-badge" id="stdBtn">4.1.1</button>
  </div>
</header>

<!-- Standard popup -->
<div id="stdPopup" class="popup hidden">
  <div class="popup-box">
    <button class="popup-close" id="stdClose">✕</button>
    <h3 id="stdTitle">Estándar Utah SEEd 4.1.1</h3>
    <p id="stdDesc">¡Aprende cómo las partes de una planta la ayudan a <strong>sobrevivir</strong>, <strong>crecer</strong> y <strong>reproducirse</strong> en su ambiente!</p>
  </div>
</div>

<main>
  <!-- Environment selector -->
  <div class="env-row">
    <button class="env-btn active" data-env="desert">🏜️<br><span>Desierto de Utah</span></button>
    <button class="env-btn" data-env="forest">🌲<br><span>Bosque de Utah</span></button>
    <button class="env-btn" data-env="wetland">🦆<br><span>Humedal de Utah</span></button>
  </div>

  <!-- Coming-soon notice for non-desert -->
  <div id="comingSoon" class="coming-soon hidden"></div>

  <!-- Main scene + info panel -->
  <div class="scene-row">
    <div id="scene">
      <svg id="plantSvg" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div id="infoPanel" class="info-panel hidden">
      <button class="info-close" id="infoClose">✕</button>
      <div class="info-emoji" id="infoEmoji"></div>
      <div class="info-title" id="infoTitle"></div>
      <div class="info-body" id="infoBody"></div>
    </div>
  </div>

  <p class="hint-text" id="hintText">👆 ¡Haz clic en los puntos brillantes de la planta para aprender sobre cada parte!</p>
</main>

<script src="app.js"></script>
</body>
</html>
